[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=3.4", "wheel"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]

name = "DoorPi"
description = "Provide intercom station to the door station via VoIP"
readme = "README.rst"
requires-python = ">=3.10"
license = { text = "CC BY-NC 4.0" }
authors = [
  { name = "Wüstengecko", email = "1579756+Wuestengecko@users.noreply.github.com" },
]
keywords = ["intercom", "VoIP", "doorstation", "home automation", "IoT"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: Free for non-commercial use",
  "Natural Language :: English",
  "Natural Language :: German",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Internet Phone",
  "Topic :: Communications :: Telephony",
  "Topic :: Home Automation",
  "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
  "Topic :: Multimedia :: Video :: Capture",
  "Topic :: Security",
  "Topic :: System :: Hardware",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "aiohttp",
  "aiohttp-jinja2",
  "docutils>=0.14",
  "jinja2>=2.11.0",
  "paho-mqtt>=2.1.0,<3",
  "pyserial>=2.7",
  "requests>=2.7.0",
  "toml>=0.10.1",
  "watchdog>=0.8.3",
]

[project.urls]
Homepage = "https://github.com/wuestengecko/DoorPi"

[project.optional-dependencies]
gpiod = ["gpiod>=2.1.3,<3"]
raspi = [
  "RPi.GPIO>=0.5.11",
  "picamera>=1.10",
  "pifacecommon>=4.1.2",
  "pifacedigitalio>=3.0.5",
]

[project.scripts]
doorpi = "doorpi.__main__:main"

[project.entry-points."doorpi.actions"]
call = "doorpi.actions.call:CallAction"
callf = "doorpi.actions.call:CallFromFileAction"
exec = "doorpi.actions.subproc:OSExecuteAction"
file_call_value = "doorpi.actions.call:CallFromFileAction"
hangup = "doorpi.actions.call:HangupAction"
http_request = "doorpi.actions.http_request:HTTPRequestAction"
log = "doorpi.actions.log:LogAction"
mail = "doorpi.actions.mail:MailAction"
mailto = "doorpi.actions.mail:MailAction"
mqtt_publish = "doorpi.actions.mqtt:MQTTPublishAction"
os_execute = "doorpi.actions.subproc:OSExecuteAction"
out = "doorpi.actions.out:instantiate"
sleep = "doorpi.actions.control:SleepAction"
snap_picam = "doorpi.actions.snapshot:PicamSnapshotAction"
snap_url = "doorpi.actions.snapshot:URLSnapshotAction"
statusfile = "doorpi.actions.statusfile:StatusfileAction"
symcon_ips3 = "doorpi.actions.symcon_ips3:instantiate"
time_tick = "doorpi.actions.tick:TickAction"
waitevent = "doorpi.actions.control:WaitEventAction"

[project.entry-points."doorpi.keyboards"]
filesystem = "doorpi.keyboard.from_filesystem:FilesystemKeyboard"
gpio = "doorpi.keyboard.from_gpio:GPIOKeyboard"
gpiod = "doorpi.keyboard.from_gpiod:GPIODKeyboard"
mqtt = "doorpi.keyboard.from_mqtt:MQTTKeyboard"
piface = "doorpi.keyboard.from_piface:PifaceKeyboard"
pn532 = "doorpi.keyboard.from_pn532:PN532Keyboard"
rdm6300 = "doorpi.keyboard.from_rdm6300:RDM6300Keyboard"
serial = "doorpi.keyboard.serial:SeriallyConnectedKeyboard"

[project.entry-points."doorpi.sipphones"]
dummy = "doorpi.sipphone.from_dummy:DummyPhone"
pjsua2 = "doorpi.sipphone.from_pjsua2.glue:Pjsua2"

[tool.docformatter]
wrap-descriptions = 88
wrap-summaries = 88

[tool.mypy]
disallow_incomplete_defs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["test.*"]
disallow_incomplete_defs = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Untyped 3rd party libs
module = [
  "RPi.*",
  "aiohttp.*",
  "aiohttp_jinja2.*",
  "aiohttp_session.*",
  "jinja2.*",
  "gpiod.*",
  "nfc.*",
  "picamera.*",
  "pifacecommon.*",
  "pifacedigitalio.*",
  "pjsua2.*",
  "serial.*",
  "setuptools.*",
  "watchdog.*",
]
ignore_missing_imports = true

[tool.ruff]
preview = true

[tool.ruff.lint]
extend-select = [
  "ARG",    # flake8-unused-arguments
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "D",      # pydocstyle
  "D212",   # "Multi-line docstring summary should start at the first line"
  "D402",   # "First line should not be the function’s 'signature'"
  "D417",   # "Missing argument descriptions in the docstring"
  "ERA",    # eradicate
  "FA",     # flake8-future-annotations
  "FIX",    # flake8-fixme
  "FURB",   # refurb
  "G",      # flake8-logging-format
  "I",      # isort
  "ICN",    # flake8-import-conventions
  "ISC001", # "Implicitly concatenated string literals on one line"
  "ISC003", # "Explicitly concatenated string should be implicitly concatenated"
  "LOG",    # flake8-logging
  "PIE",    # flake8-pie
  "PL",     # pylint
  "RET",    # flake8-return
  "RUF",    # ruff
  "SIM",    # flake8-simplify
  "TCH005", # "Found empty type-checking block"
  "T1",     # flake8-debugger
  "UP",     # pyupgrade
  "YTT",    # flake8-2020
]
extend-ignore = [
  "D1",      # Missing docstring in _
  "D201",    # No blank lines allowed before function docstring  # auto-formatting
  "D202",    # No blank lines allowed after function docstring  # auto-formatting
  "D203",    # 1 blank line required before class docstring  # auto-formatting
  "D204",    # 1 blank line required after class docstring  # auto-formatting
  "D211",    # No blank lines allowed before class docstring  # auto-formatting
  "D213",    # Multi-line docstring summary should start at the second line
  "DTZ001",  # `tzinfo=None` passed to `datetime.datetime()`
  "DTZ005",  # `tz=None` passed to `datetime.datetime.now()`
  "E402",    # Module level import not at top of file
  "F403",    # `from _ import *` used; unable to detect undefined names
  "F405",    # `_` may be undefined, or defined from star imports
  "PLC0414", # Import alias does not rename original package # used for explicit reexports
  "PLR0904", # Too many public methods
  "PLR0911", # Too many return statements
  "PLR0912", # Too many branches
  "PLR0913", # Too many arguments in function definition
  "PLR0914", # Too many local variables
  "PLR0915", # Too many statements
  "PLR0916", # Too many Boolean expressions
  "PLR0917", # Too many positional arguments
  "PLR2004", # Magic value used in comparison, consider replacing `_` with a constant variable
  "PLR6301", # Method `_` could be a function, class method, or static method
  "PLW0603", # Using the global statement to update `_` is discouraged
  "PLW2901", # Loop variable overwritten by assignment target
  "SIM108",  # Use ternary operator instead of `if`-`else`-block
]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-decorators = ["typing.overload"]

[tool.setuptools]
platforms = ["any"]
zip-safe = false

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.setuptools.packages.find]
include = ["doorpi", "doorpi.*"]

[tool.setuptools_scm]
# This section must exist for setuptools_scm to work
